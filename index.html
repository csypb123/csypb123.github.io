<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>杨鹏博 · 个人主页已迁移</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://csypb123.github.io/my-intro/">
<meta http-equiv="refresh" content="0; url=https://csypb123.github.io/my-intro/">
<style>
  :root{ --violet:#6d4dfa; --pink:#c026d3; --text:#151a2e; --text-3:#7d87a6; }
  *{ box-sizing:border-box; margin:0; padding:0 }
  body{
    min-height:100svh; display:grid; place-items:center; padding:24px;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(109,77,250,.12), transparent 60%),
      #fff;
    color:var(--text); text-align:center;
    font-family:"Inter var","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.7;
  }
  .mark{
    width:56px; height:56px; margin:0 auto 20px; border-radius:17px;
    display:grid; place-items:center; font-weight:800; font-size:1.4rem; color:#fff;
    background:linear-gradient(120deg,#5eead4,#6d4dfa 45%,#c026d3);
    box-shadow:0 18px 40px -20px rgba(109,77,250,.95);
  }
  h1{ font-size:clamp(1.15rem,4vw,1.45rem); letter-spacing:-.01em }
  p{ margin-top:10px; font-size:.9rem; color:var(--text-3) }
  a{
    display:inline-block; margin-top:22px; padding:11px 24px; border-radius:999px;
    font-size:.92rem; font-weight:600; color:#fff; text-decoration:none;
    background:linear-gradient(120deg,#5eead4,#6d4dfa 45%,#c026d3);
    box-shadow:0 16px 34px -18px rgba(109,77,250,.9);
  }
</style>
</head>
<body>
  <main>
    <div class="mark">杨</div>
    <h1>个人主页已迁移</h1>
    <p>新地址：csypb123.github.io/my-intro/</p>
    <a href="https://csypb123.github.io/my-intro/">前往新地址</a>
  </main>
  <script>
    // 带一次跳转参数，避免浏览器缓存住这次重定向
    location.replace('https://csypb123.github.io/my-intro/?from=root');
  </script>
</body>
</html>
