name: Legacy root redirect
# 这个仓库原先是「用户站点」(csypb123.github.io 根目录)。
# 主页已迁移到项目站点 csypb123/my-intro（网址 /my-intro/）。
# 这里只发布一个跳转页，让旧链接继续可用，不再重复托管整站内容。
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble redirect-only site
        run: |
          mkdir _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
